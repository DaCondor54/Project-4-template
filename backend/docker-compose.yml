services:
  gateway:
    container_name: gateway
    build: 
      context: .
      dockerfile: ./Gateway/Dockerfile
    ports:
      - 3000:3000
    networks:
      - monitoring
    
  resys:
    container_name: resys
    build:
      context: .
      dockerfile: ./RecommendationSystem/Dockerfile
    networks:
      - monitoring
      - db-access
  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: flemdb
    volumes:
      - ./database/mongo-ini.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - db-access

networks:
  db-access:
  monitoring:
